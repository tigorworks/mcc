<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBD — Data Tim MCC Season 1</title>
  <link rel="icon" href="assets/images/mcc.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:        #e60026;
      --red-dark:   #b0001e;
      --bg:         #07091a;
      --bg-2:       #0b0f22;
      --bg-3:       #111528;
      --bg-card:    rgba(14,18,40,0.90);
      --border:     rgba(255,255,255,0.10);
      --text:       #dde1ee;
      --text-dim:   #8896b2;
      --white:      #ffffff;
      --font-head:  'Rajdhani', sans-serif;
      --font-body:  'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ──────────────────────────────── */
    .dbd-header {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .dbd-header img { height: 36px; width: auto; }
    .dbd-header-text h1 {
      font-family: var(--font-head);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1.2;
    }
    .dbd-header-text p {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.1rem;
    }

    /* ── Main container ──────────────────────── */
    .dbd-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Stats row ───────────────────────────── */
    .stat-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .stat-card {
      flex: 1;
      min-width: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.4rem;
    }
    .stat-card .stat-val {
      font-family: var(--font-head);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--red);
      line-height: 1;
    }
    .stat-card .stat-lbl {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Filter bar ──────────────────────────── */
    .dbd-filter {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .dbd-search {
      flex: 1;
      min-width: 200px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .dbd-search:focus { border-color: var(--red); }
    .dbd-search::placeholder { color: var(--text-dim); }

    .dbd-refresh {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 1rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .dbd-refresh:hover { border-color: var(--red); color: var(--text); }
    .dbd-refresh svg { width: 14px; height: 14px; }

    /* ── Table ───────────────────────────────── */
    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: rgba(255,255,255,0.04); }
    th {
      padding: 0.85rem 1rem;
      text-align: left;
      font-family: var(--font-head);
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 0.8rem 1rem;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.03); }

    .td-num {
      color: var(--text-dim);
      font-size: 0.82rem;
      width: 3rem;
      text-align: center;
    }
    .td-team { font-weight: 600; color: var(--white); }
    .td-company { color: var(--text); }
    .td-captain { color: var(--text-dim); font-size: 0.85rem; }
    .td-wa { font-size: 0.82rem; }
    .td-wa a { color: #4ade80; text-decoration: none; }
    .td-wa a:hover { text-decoration: underline; }
    .td-players {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-dim);
    }
    .td-invoice {
      text-align: center;
      width: 3.5rem;
    }
    .btn-inv {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.55rem;
      color: var(--text-dim);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-inv:hover { border-color: var(--red); color: var(--red); }
    .btn-inv svg { width: 14px; height: 14px; }
    .badge-company {
      display: inline-block;
      background: rgba(230,0,38,0.12);
      border: 1px solid rgba(230,0,38,0.25);
      color: #ff6680;
      font-size: 0.75rem;
      border-radius: 6px;
      padding: 0.15rem 0.55rem;
      font-weight: 500;
    }

    /* ── States ──────────────────────────────── */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
      gap: 1rem;
      text-align: center;
    }
    .state-box .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-box .state-icon { font-size: 2.5rem; }
    .state-box .state-msg { font-size: 0.95rem; }
    .state-box .state-sub { font-size: 0.82rem; color: var(--text-dim); opacity: 0.7; }
    .retry-btn {
      margin-top: 0.5rem;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.25rem;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .retry-btn:hover { background: var(--red-dark); }

    /* ── Footer ──────────────────────────────── */
    .dbd-footer {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    #lastUpdated { color: var(--text-dim); }

    /* ── Checklist perusahaan ────────────────── */
    .checklist-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }
    .checklist-title {
      font-family: var(--font-head);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .checklist-progress { font-size: 0.72rem; color: var(--text-dim); }
    .checklist-progress strong { color: var(--white); }
    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.55rem;
    }
    .cl-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .cl-item.registered {
      border-color: rgba(22,163,74,0.35);
      background: rgba(22,163,74,0.06);
    }
    .cl-icon {
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }
    .cl-item.registered .cl-icon { background: rgba(22,163,74,0.2); color: #4ade80; }
    .cl-item:not(.registered) .cl-icon { background: rgba(255,255,255,0.05); color: var(--text-dim); }
    .cl-name {
      font-size: 0.8rem;
      color: var(--text-dim);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cl-item.registered .cl-name { color: var(--text); }
    .cl-badge {
      font-family: var(--font-head);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      background: rgba(22,163,74,0.2);
      color: #4ade80;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 640px) {
      .dbd-header { padding: 1rem; }
      .dbd-wrap { padding: 1.25rem 1rem 3rem; }
      .td-captain, .td-wa, .td-players { display: none; }
      .btn-inv-lbl { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="dbd-header">
    <img src="assets/images/mcc.png" alt="MCC Logo" />
    <div class="dbd-header-text">
      <h1>Dashboard Data Tim</h1>
      <p>MCC Season 1 — Data langsung dari Google Sheet</p>
    </div>
  </header>

  <!-- Main -->
  <div class="dbd-wrap">

    <!-- Stats -->
    <div class="stat-row" id="statRow" style="display:none">
      <div class="stat-card">
        <div class="stat-val" id="statTeams">—</div>
        <div class="stat-lbl">Total Tim</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statCompanies">—</div>
        <div class="stat-lbl">Perusahaan</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statPlayers">—</div>
        <div class="stat-lbl">Total Pemain</div>
      </div>
    </div>

    <!-- Checklist perusahaan -->
    <div class="checklist-card" id="checklistCard" style="display:none">
      <div class="checklist-title">
        <span>Status Pendaftaran Perusahaan</span>
        <span class="checklist-progress" id="checklistProgress"></span>
      </div>
      <div class="checklist-grid" id="checklistGrid"></div>
    </div>

    <!-- Filter -->
    <div class="dbd-filter" id="filterBar" style="display:none">
      <input class="dbd-search" type="text" id="searchInput"
             placeholder="Cari nama tim atau perusahaan..." />
      <button class="dbd-refresh" onclick="loadData()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Refresh
      </button>
      <button class="dbd-refresh" onclick="downloadContacts()" title="Download nomor kontak kapten semua tim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Kontak
      </button>
    </div>

    <!-- Table container -->
    <div class="table-wrap" id="tableWrap">
      <div class="state-box" id="stateBox">
        <div class="spinner"></div>
        <span class="state-msg">Memuat data tim...</span>
      </div>
    </div>

    <!-- Footer info -->
    <div class="dbd-footer" id="dbdFooter" style="display:none">
      <span>Menampilkan <strong id="visibleCount">—</strong> tim</span>
      <span id="lastUpdated"></span>
    </div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUJr2hGrd4cNWUR29LwiiODoB5so0KHI2qJCZDDeyKznt5dDEX87O9kPX6HLEFDY0f/exec';
    const TEAM_FEE  = 500000;

    let _allTeams   = [];
    let _allMembers = [];

    /* ── Phone normalizer ───────────────────── */
    function normalizePhone(raw) {
      if (!raw) return null;
      const digits = String(raw).replace(/\D/g, '');
      if (digits.length < 5) return null;
      if (digits.startsWith('62')) return '0' + digits.slice(2);
      if (digits.startsWith('0'))  return digits;
      return '0' + digits; // starts with 8 or other
    }

    function formatPhoneDisplay(raw) {
      const local = normalizePhone(raw);
      if (!local) return '—';
      return '+62' + local.slice(1);
    }

    /* ── Download kontak kapten ─────────────── */
    function downloadContacts() {
      if (!_allTeams.length) return;
      const lines = _allTeams.map(tm => {
        const name    = tm.name || tm.team_name || tm.nama_tim || '—';
        const captain = tm.captain || tm.captain_name || tm.kapten || '—';
        const phone   = normalizePhone(tm.captain_wa || tm.captain_phone || '') || '-';
        return `${name} : ${phone} (${captain})`;
      }).join('\n');

      const blob = new Blob([lines], { type: 'text/plain;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'kontak-kapten-mcc.txt';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    /* ── Rupiah formatter ───────────────────── */
    function formatRupiah(n) {
      return 'Rp ' + Number(n).toLocaleString('id-ID');
    }

    /* ── Invoice number formatter ───────────── */
    function formatInvNo(date, rowNum) {
      const d  = date || new Date();
      const y  = d.getFullYear();
      const m  = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const n  = String(rowNum || 1).padStart(5, '0');
      return `MCC-${y}${m}${dd}${n}`;
    }

    /* ── Generate invoice HTML (per registrasi / per perusahaan) ── */
    function generateInvoiceHtml(teams) {
      const first   = teams[0];
      const company = first.company || first.perusahaan || first.company_name || '—';
      const picName = first.pic_name || first.pic || '—';
      const picWa   = first.pic_wa   || '—';
      const total   = teams.length * TEAM_FEE;

      const now     = new Date();
      const rowNum  = first.row_number || first.row || (_allTeams.indexOf(first) + 2);
      const invNo   = formatInvNo(now, rowNum);
      const invDate = now.toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });

      /* Baris tabel rincian pembayaran */
      const teamRows = teams.map((tm, i) => {
        const tName   = tm.name || tm.team_name || tm.nama_tim || '—';
        const captain = tm.captain || tm.captain_name || tm.kapten || '—';
        const pCount  = (Array.isArray(tm.players) ? tm.players.length : 0)
                        || tm.total_players || tm.jumlah_pemain || '—';
        return `
        <tr>
          <td style="padding:8px 12px;border:1px solid #ddd">${i + 1}</td>
          <td style="padding:8px 12px;border:1px solid #ddd">${tName}</td>
          <td style="padding:8px 12px;border:1px solid #ddd">${captain}</td>
          <td style="padding:8px 12px;border:1px solid #ddd">${pCount} pemain</td>
          <td style="padding:8px 12px;border:1px solid #ddd;text-align:right">${formatRupiah(TEAM_FEE)}</td>
        </tr>`;
      }).join('');

      /* Seksi roster per tim */
      const rosterSections = teams.map((tm, i) => {
        const tName   = tm.name || tm.team_name || tm.nama_tim || '—';
        const players = Array.isArray(tm.players) ? tm.players : [];
        const playerRows = players.length
          ? players.map((p, j) => `
            <tr>
              <td style="padding:5px 10px;border:1px solid #ddd">${j + 1}</td>
              <td style="padding:5px 10px;border:1px solid #ddd">${p.name || '—'}</td>
              <td style="padding:5px 10px;border:1px solid #ddd">${p.game_id || '—'}</td>
              <td style="padding:5px 10px;border:1px solid #ddd">${p.game_nick || '—'}</td>
            </tr>`).join('')
          : `<tr><td colspan="4" style="padding:10px;border:1px solid #ddd;color:#999;text-align:center">Data roster tidak tersedia</td></tr>`;

        return `
        <div style="margin-bottom:24px">
          <p style="font-weight:700;font-size:14px;margin:0 0 8px 0;color:#1a1a2e">
            Tim ${i + 1}: ${tName}
          </p>
          <table>
            <thead>
              <tr>
                <th style="width:36px">#</th>
                <th>Nama Pemain</th>
                <th>Game ID</th>
                <th>Nickname</th>
              </tr>
            </thead>
            <tbody>${playerRows}</tbody>
          </table>
        </div>`;
      }).join('');

      const picSection = (picName !== '—' || picWa !== '—') ? `
        <div class="info-row"><span class="info-lbl">PIC / Manager</span><span class="info-val">${picName}</span></div>
        <div class="info-row"><span class="info-lbl">WhatsApp PIC</span><span class="info-val">${picWa}</span></div>` : '';

      return `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Invoice — ${company} — MCC Season 1</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; color: #1a1a2e; margin: 0; padding: 32px; background: #fff; }
    @media print {
      body { padding: 0; }
      .no-print { display: none !important; }
      @page { margin: 20mm; }
    }
    .inv-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; border-bottom: 3px solid #e60026; padding-bottom: 20px; }
    .inv-logo { display: flex; align-items: center; gap: 12px; }
    .inv-logo img { height: 48px; }
    .inv-logo-text h1 { margin: 0; font-size: 20px; color: #e60026; letter-spacing: 1px; }
    .inv-logo-text p { margin: 2px 0 0; font-size: 11px; color: #666; }
    .inv-meta { text-align: right; }
    .inv-meta .inv-title { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .inv-meta p { margin: 2px 0; font-size: 13px; color: #555; }
    .inv-meta span { font-weight: 600; color: #1a1a2e; }
    .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #e60026; margin: 24px 0 8px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; font-size: 13px; }
    .info-row { display: flex; gap: 8px; padding: 4px 0; }
    .info-lbl { color: #666; min-width: 140px; }
    .info-val { font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead tr { background: #e60026; color: #fff; }
    th { padding: 10px 12px; text-align: left; font-weight: 600; border: 1px solid #c00; }
    .total-row { background: #fef2f4; }
    .total-row td { font-weight: 700; font-size: 15px; }
    .footer-note { margin-top: 32px; padding: 16px; background: #f9f9f9; border-left: 4px solid #e60026; font-size: 12px; color: #555; border-radius: 4px; }
    .print-btn { margin: 24px auto 0; display: block; padding: 12px 32px; background: #e60026; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600; }
    .print-btn:hover { background: #b0001e; }
  </style>
</head>
<body>

  <div class="inv-header">
    <div class="inv-logo">
      <img src="https://tigorworks.github.io/mcc/assets/images/mcc.png" alt="MCC Logo" />
      <div class="inv-logo-text">
        <h1>MCC</h1>
        <p>Mobile Legends Corporate Championship</p>
      </div>
    </div>
    <div class="inv-meta">
      <div class="inv-title">INVOICE</div>
      <p>No. Invoice: <span>${invNo}</span></p>
      <p>Tanggal: <span>${invDate}</span></p>
      <p>Status: <span style="color:#16a34a">✓ Terdaftar</span></p>
    </div>
  </div>

  <div class="section-title">Data Pendaftar</div>
  <div class="info-grid">
    <div class="info-row"><span class="info-lbl">Perusahaan</span><span class="info-val">${company}</span></div>
    <div class="info-row"><span class="info-lbl">Jumlah Tim</span><span class="info-val">${teams.length} tim</span></div>
    ${picSection}
  </div>

  <div class="section-title">Rincian Pembayaran</div>
  <table>
    <thead>
      <tr>
        <th style="width:40px">#</th>
        <th>Nama Tim</th>
        <th>Kapten</th>
        <th>Jumlah Pemain</th>
        <th style="text-align:right">Biaya</th>
      </tr>
    </thead>
    <tbody>
      ${teamRows}
      <tr class="total-row">
        <td colspan="4" style="padding:10px 12px;border:1px solid #ddd;text-align:right">
          Total Pembayaran (${teams.length} tim × ${formatRupiah(TEAM_FEE)})
        </td>
        <td style="padding:10px 12px;border:1px solid #ddd;text-align:right;color:#e60026">${formatRupiah(total)}</td>
      </tr>
    </tbody>
  </table>

  <div class="section-title">Roster Pemain</div>
  ${rosterSections}

  <div class="footer-note">
    <strong>Catatan:</strong> Invoice ini merupakan bukti pendaftaran tim MCC Season 1.
    Panitia akan menghubungi Anda melalui WhatsApp untuk konfirmasi dan verifikasi data.
    Harap simpan dokumen ini sebagai referensi.
  </div>

  <button class="print-btn no-print" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
</body>
</html>`;
    }

    /* ── Download invoice (per registrasi = company + pic_wa) ──── */
    function downloadInvoice(idx) {
      const tm = _allTeams[idx];
      if (!tm) return;

      /* Kelompokkan berdasarkan registrasi yang sama: perusahaan + WhatsApp PIC.
         Satu submit form bisa mendaftarkan beberapa tim sekaligus — semua tim
         tersebut berbagi pic_wa yang sama, sehingga masuk ke 1 invoice.
         Jika perusahaan daftar 2x (pic_wa berbeda) → 2 invoice terpisah. */
      const company = (tm.company || tm.perusahaan || tm.company_name || '').trim();
      const picWa   = (tm.pic_wa || '').trim();

      const sameGroup = _allTeams.filter(t => {
        const co = (t.company || t.perusahaan || t.company_name || '').trim();
        const wa = (t.pic_wa || '').trim();
        return co === company && (picWa ? wa === picWa : co === company);
      });
      const teams = sameGroup.length ? sameGroup : [tm];

      const html = generateInvoiceHtml(teams);
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const win  = window.open(url, '_blank');
      if (!win) {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'invoice-mcc-' + company.replace(/\s+/g, '-').toLowerCase() + '.html';
        a.click();
      }
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    /* ── Render checklist perusahaan ───────────── */
    function renderChecklist(members, teams) {
      if (!members.length) return;

      /* Hitung jumlah tim per perusahaan dari data sheet */
      const teamCount = {};
      teams.forEach(tm => {
        const co = (tm.company || tm.perusahaan || tm.company_name || '').trim();
        if (co) teamCount[co] = (teamCount[co] || 0) + 1;
      });

      const registered = Object.keys(teamCount).length;
      const total      = members.length;

      document.getElementById('checklistProgress').innerHTML =
        `<strong>${registered}</strong> / ${total} perusahaan terdaftar`;

      /* Urutkan: yang sudah daftar duluan, lalu yang belum */
      const sorted = [...members].sort((a, b) => {
        const aReg = (teamCount[a.name] || 0) > 0;
        const bReg = (teamCount[b.name] || 0) > 0;
        if (aReg === bReg) return 0;
        return aReg ? -1 : 1;
      });

      const items = sorted.map(m => {
        const count = teamCount[m.name] || 0;
        const isReg = count > 0;
        return `
        <div class="cl-item ${isReg ? 'registered' : ''}">
          <div class="cl-icon">${isReg ? '✓' : '–'}</div>
          <span class="cl-name" title="${esc(m.name)}">${esc(m.name)}</span>
          ${isReg ? `<span class="cl-badge">${count} tim</span>` : ''}
        </div>`;
      }).join('');

      document.getElementById('checklistGrid').innerHTML = items;
      document.getElementById('checklistCard').style.display = '';
    }

    /* ── Load members.json ──────────────────── */
    async function loadMembers() {
      if (_allMembers.length) return _allMembers;
      try {
        const resp = await fetch('configuration/members.json', { cache: 'no-store' });
        _allMembers = (await resp.json()).filter(m => m.visible !== false);
      } catch (e) {
        console.warn('[dbd] members.json load failed', e);
        _allMembers = [];
      }
      return _allMembers;
    }

    /* ── Fetch data dari GAS sheet ──────────── */
    async function loadData() {
      showLoading();
      try {
        const [gasResp, members] = await Promise.all([
          fetch(SCRIPT_URL + '?action=getTeams&t=' + Date.now(), { redirect: 'follow' }),
          loadMembers()
        ]);

        if (!gasResp.ok) throw new Error('HTTP ' + gasResp.status);
        const json = await gasResp.json();
        if (!json.ok) throw new Error(json.error || 'Gagal memuat data.');
        if (!Array.isArray(json.teams)) throw new Error('Format data tidak dikenali.');

        _allTeams = json.teams;
        renderChecklist(members, _allTeams);
        renderTable(_allTeams);
        updateStats(_allTeams);
        document.getElementById('statRow').style.display   = '';
        document.getElementById('filterBar').style.display = '';
        document.getElementById('dbdFooter').style.display = '';
        document.getElementById('lastUpdated').textContent =
          'Diperbarui: ' + new Date().toLocaleString('id-ID');

      } catch (err) {
        console.error('[dbd] fetch error', err);
        showError(err.message);
      }
    }

    /* ── Render table ───────────────────────── */
    function renderTable(teams) {
      const wrap = document.getElementById('tableWrap');
      if (!teams.length) {
        wrap.innerHTML = `<div class="state-box">
          <span class="state-icon">📭</span>
          <span class="state-msg">Tidak ada tim ditemukan</span>
        </div>`;
        document.getElementById('visibleCount').textContent = 0;
        return;
      }

      const rows = teams.map((tm, i) => {
        const allIdx = _allTeams.indexOf(tm);
        return `
        <tr>
          <td class="td-num">${i + 1}</td>
          <td class="td-team">${esc(tm.name || tm.team_name || tm.nama_tim || '—')}</td>
          <td class="td-company">
            <span class="badge-company">${esc(tm.company || tm.perusahaan || tm.company_name || '—')}</span>
          </td>
          <td class="td-captain">${esc(tm.captain || tm.captain_name || tm.kapten || '—')}</td>
          <td class="td-wa">${(() => {
            const p = formatPhoneDisplay(tm.captain_wa || tm.captain_phone || '');
            if (p === '—') return '—';
            const local = normalizePhone(tm.captain_wa || tm.captain_phone || '');
            return `<a href="tel:${local}">${p}</a>`;
          })()}</td>
          <td class="td-players">${tm.players?.length ?? tm.total_players ?? tm.jumlah_pemain ?? '—'}</td>
          <td class="td-invoice">
            <button class="btn-inv" title="Download Invoice" onclick="downloadInvoice(${allIdx})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </button>
          </td>
        </tr>`;
      }).join('');

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th class="td-num">#</th>
              <th>Nama Tim</th>
              <th>Perusahaan</th>
              <th class="td-captain">Kapten</th>
              <th class="td-wa">WA Kapten</th>
              <th class="td-players">Pemain</th>
              <th class="td-invoice">Invoice</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;

      document.getElementById('visibleCount').textContent = teams.length;
    }

    /* ── Stats ──────────────────────────────── */
    function updateStats(teams) {
      document.getElementById('statTeams').textContent = teams.length;
      const companies = new Set(teams.map(t => t.company || t.perusahaan || t.company_name)).size;
      document.getElementById('statCompanies').textContent = companies;
      const players = teams.reduce((sum, t) =>
        sum + (t.players?.length ?? t.total_players ?? t.jumlah_pemain ?? 0), 0);
      document.getElementById('statPlayers').textContent = players || '—';
    }

    /* ── Search filter ──────────────────────── */
    document.getElementById('searchInput')?.addEventListener('input', function () {
      const q = this.value.toLowerCase().trim();
      const filtered = !q ? _allTeams : _allTeams.filter(tm =>
        (tm.name || tm.team_name || tm.nama_tim || '').toLowerCase().includes(q) ||
        (tm.company || tm.perusahaan || tm.company_name || '').toLowerCase().includes(q) ||
        (tm.captain || tm.captain_name || tm.kapten || '').toLowerCase().includes(q)
      );
      renderTable(filtered);
    });

    /* ── State helpers ──────────────────────── */
    function showLoading() {
      document.getElementById('tableWrap').innerHTML = `
        <div class="state-box">
          <div class="spinner"></div>
          <span class="state-msg">Memuat data tim...</span>
        </div>`;
      /* Reset stats & checklist progress agar user tahu sedang refresh */
      ['statTeams','statCompanies','statPlayers'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '…';
      });
      const prog = document.getElementById('checklistProgress');
      if (prog) prog.textContent = 'Memuat…';
    }

    function showError(msg) {
      document.getElementById('tableWrap').innerHTML = `
        <div class="state-box">
          <span class="state-icon">⚠️</span>
          <span class="state-msg">Gagal memuat data</span>
          <span class="state-sub">${esc(msg)}</span>
          <button class="retry-btn" onclick="loadData()">Coba Lagi</button>
        </div>`;
    }

    function esc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ── Init ───────────────────────────────── */
    loadData();
  </script>
</body>
</html>
